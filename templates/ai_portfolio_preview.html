{% extends "base.html" %}
{% block title %}AI Generated Portfolio{% endblock %}

{% block content %}
<div class="form-wrapper">
  <div class="form-box">
    <h2 class="text-center mb-4">AI-Generated Portfolio</h2>

    <div class="mb-3 text-center">
      <a href="{{ download_link }}" class="btn btn-success" download>⬇️ Download HTML</a>
      <a href="{{ logout_url }}" class="btn btn-logout">Logout</a>
    </div>

    <hr>
    <h4 class="text-center">Preview:</h4>
    <iframe src="{{ download_link }}" width="100%" height="600px" frameborder="0" style="border:1px solid #ccc;"></iframe>
  </div>
</div>
{% endblock %}
