{% extends "base.html" %}
{% block title %}Interview Questions for {{ username }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>📄 Interview Questions for {{ username }}</h2>
    <p><strong>Skills:</strong> {{ skills | join(', ') }}</p>
    <div class="question-box">
        <pre style="font-family: monospace; white-space: pre-wrap;">{{ questions_text }}</pre>
    </div>

    <form action="{{ url_for('download_interview_pdf') }}" method="POST">
        <input type="hidden" name="questions_text" value="{{ questions_text }}">
        <input type="hidden" name="username" value="{{ username }}">
        <button type="submit" class="btn btn-primary mt-3">⬇️ Download PDF</button>
    </form>

    <div class="mt-3">
        <a href="{{ url_for('home') }}" class="btn btn-secondary">🏠 Back to Home</a>
    </div>
</div>
{% endblock %}
