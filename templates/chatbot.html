{% extends "base.html" %}

{% block title %}RAG Chatbot{% endblock %}

{% block content %}
<style>
  .chat-bubble {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 18px;
  margin: 10px;
  clear: both;
  white-space: pre-line;
  line-height: 1.5;
}

.chat-bubble.user {
  background-color: #d1e7dd;
  align-self: flex-end;
  float: right;
  text-align: right;
}

.chat-bubble.bot {
  background-color: #e2e3e5;
  align-self: flex-start;
  float: left;
  text-align: left;
}

#chat-history {
  display: flex;
  flex-direction: column;
}

#chat-history.enlarged {
  min-height: 400px;
  max-height: 600px;
}

#chat-history {
  transition: all 0.3s ease-in-out;
}
.form-box {
  transition: max-width 0.3s ease-in-out;
}


</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/multipleres.css') }}">

<div class="form-wrapper">
  <div class="form-box shadow">
    <h2 class="text-center mb-4">RAG Chatbot for HR</h2>

    
    <form id="upload-form" enctype="multipart/form-data" class="mb-4">
        <h4>Upload Two Resumes (PDFs)</h4>
     <div class="mb-3">
        <input type="file" name="pdfs" multiple required class="form-control" accept="application/pdf" />
      </div>

      <div class="mb-3">
        <label for="job_description" class="form-label">Paste Job Description:</label>
        <textarea name="job_description" id="job_description" rows="6" class="form-control" required></textarea>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Upload resumes</button>
      </div>
    </form>


<div id="chat-section" style="display: none;">
  <h4>Chat with Resumes</h4>
  <div id="chat-history" class="border rounded p-3 mb-3" style="min-height: 200px; max-height: 400px; overflow-y: auto; background: #f8f9fa;"></div>

  <div class="input-group">
    <input type="text" id="question" placeholder="Ask something..." class="form-control" />
    <button onclick="sendQuestion()" class="btn btn-success">Send</button>
  </div>

  <div class="action-links mt-4 text-center">
      <a href="/logout" class="btn btn-logout">Logout</a>
</div>

</div>
 
  </div>
</div>

<script>
  const chatHistory = document.getElementById("chat-history");

  document.getElementById("upload-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const formData = new FormData(this);
    const response = await fetch("/upload_pdfs_for_chat", {
      method: "POST",
      body: formData
    });
    const data = await response.json();
    alert(data.message || data.error);

    if (data.message) {
      document.getElementById("upload-form").style.display = "none"; // ✅ hide form
      document.getElementById("chat-section").style.display = "block"; // ✅ show chat
      chatHistory.innerHTML = "";  // Clear previous chat

      document.querySelector('.form-box').classList.add('enlarged');
      document.getElementById("chat-history").classList.add('enlarged');
    }
  });

  async function sendQuestion() {
    const input = document.getElementById("question");
    const question = input.value.trim();
    if (!question) return;

    // Show user's message
    const userMsg = `<div class="chat-bubble user"><strong>You:</strong><br>${question}</div>`;
    chatHistory.innerHTML += userMsg;

    input.value = "";  // Clear input

    const response = await fetch("/rag_chat", {
      method: "POST",
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });

    const data = await response.json();
    const botMsg = `<div class="chat-bubble bot"><strong>Bot:</strong><br>${(data.answer || data.error).replace(/\n/g, '<br>')}</div>`;
    chatHistory.innerHTML += botMsg;

    // Auto-scroll
    chatHistory.scrollTop = chatHistory.scrollHeight;
  }
</script>

{% endblock %}
